; Production PHP settings for the Leave Portal application image.

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 12M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Application code is baked into the image, so OPcache never needs to
; revalidate files. Rebuild the image after code changes:
;   docker compose up -d --build
opcache.validate_timestamps = 0
