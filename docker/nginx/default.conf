# Nginx site for the Leave Portal web container.
#
# Static files come from /usr/share/nginx/html (public/ copied at build time);
# PHP requests are forwarded to the "app" PHP-FPM service on the compose
# network. Private attachments are NOT served by Nginx: they are streamed by
# the application controllers from storage/app/private.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.php;

    charset utf-8;

    # Attachments are validated at max 5 MB (pdf/jpg/jpeg/png), 12m covers
    # multipart overhead.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
