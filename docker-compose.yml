name: leave-portal

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PHP-FPM: runs the Laravel application and one-shot migrations.
  app:
    build:
      context: .
      target: app
    image: leave-portal-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network MySQL is reachable as "db".
      DB_HOST: db
      # The entrypoint waits for MySQL and runs `php artisan migrate --force`.
      RUN_MIGRATIONS: "1"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # Nginx: serves public/ and forwards PHP requests to app:9000.
  web:
    build:
      context: .
      target: web
    image: leave-portal-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging

  # Queue worker for queued jobs/notifications (QUEUE_CONNECTION=database).
  worker:
    image: leave-portal-app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *default-logging

  # Scheduler for scheduled tasks (php artisan schedule:work).
  scheduler:
    image: leave-portal-app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    logging: *default-logging

  # MySQL 8.0. DB_DATABASE/DB_USERNAME/DB_PASSWORD come from .env; the same
  # values are used by Laravel. DB_USERNAME must not be "root".
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-leave_portal}
      MYSQL_USER: ${DB_USERNAME:-leave_portal}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

volumes:
  # /var/www/html/storage: private attachments, logs, framework caches.
  app-storage:
  # /var/lib/mysql: database data.
  db-data:
